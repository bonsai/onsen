name: Onsen GCP + Firebase
on:
  push:
    branches: [main]
    paths:
      - "django/**"
      - "web/**"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/gcp-firebase.yml"
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: asia-northeast1
      SERVICE: onsen-api
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy Django API
        run: gcloud run deploy "$SERVICE" --source django --project "$PROJECT_ID" --region "$REGION" --allow-unauthenticated --min 0 --max 3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy Firebase Hosting
        run: npx --yes firebase-tools deploy --only hosting --project "$PROJECT_ID"
